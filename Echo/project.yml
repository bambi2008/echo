name: Echo
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "5.0"
targets:
  Echo:
    type: application
    platform: iOS
    sources:
      - path: Echo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bambi2008.Echo
        INFOPLIST_KEY_CFBundleDisplayName: Echo
        INFOPLIST_KEY_NSContactsUsageDescription: "Echo uses your contacts to help you stay in touch. Everything stays on your device."
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
